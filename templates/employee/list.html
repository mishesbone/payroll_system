{% extends "base.html" %}
{% block content %}
<h1>Employee List</h1>
<a href="add.html">Add Employee</a>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Position</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <!-- Loop through employees -->
        {% for employee in employees %}
        <tr>
            <td>{{ employee.id }}</td>
            <td>{{ employee.name }}</td>
            <td>{{ employee.position }}</td>
            <td>{{ employee.salary }}</td>
            <td>
                <a href="profile.html?id={{ employee.id }}">View</a> |
                <a href="edit.html?id={{ employee.id }}">Edit</a> |
                <a href="delete?id={{ employee.id }}" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
